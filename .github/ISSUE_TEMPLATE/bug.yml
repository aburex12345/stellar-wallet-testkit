name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: Do not include private keys, seed phrases, or sensitive transaction data.
  - type: input
    id: version
    attributes:
      label: Testkit version
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        [Controller, Freighter adapter, Browser injection, XDR assertions, CLI, Documentation]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include deterministic public test data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node, OS, and relevant wallet API version
    validations:
      required: true
